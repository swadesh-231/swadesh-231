name: Generate Snake Animation

# Generates an SVG of the user's GitHub contribution grid being eaten by a snake.
# Output is committed to the `output` branch and consumed by README.md.
#
# Setup:
#   1. Place this file at .github/workflows/snake.yml in your profile repo
#      (the one at github.com/swadesh-231/swadesh-231).
#   2. Settings → Actions → General → Workflow permissions:
#      enable "Read and write permissions".
#   3. Run the workflow once manually from the Actions tab to bootstrap.

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:           # allow manual trigger
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
